[project]
name = "reframe"
version = "1.0.0"
description = "Reframe - Post-viewing retrospective narrative discovery platform powered by ClickHouse and Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "google-genai>=0.1.1",
    "google-adk>=0.1.0",
    "httpx>=0.27.0",
    "orjson>=3.9.0",
    "structlog>=24.1.0",
    "clickhouse-connect>=0.7.0",
    "mcp-clickhouse>=0.4.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pillow>=10.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "fastmcp>=0.4.0",
    "redis>=5.0.0",
    "pyjwt>=2.8.0",
    "cryptography>=44.0.0",
    "numpy>=1.26.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "playwright>=1.40.0"
]
simulation = [
    "pyarrow>=15.0.0",
    "datasets>=2.18.0",
    "huggingface-hub>=0.20.0"
]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "apps*", "pipelines*", "tools*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
